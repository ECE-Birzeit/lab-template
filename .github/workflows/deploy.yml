name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for lastUpdated
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The template repository itself only builds and tests; the labs made from it deploy
      - id: pages
        if: github.repository != 'ECE-Birzeit/lab-template'
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        # base_path is "/<repo>" for a project site and empty with a custom domain.
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Smoke test PWA service worker
        run: npm run smoke-test:pwa
      - if: github.repository != 'ECE-Birzeit/lab-template'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    if: github.repository != 'ECE-Birzeit/lab-template'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
